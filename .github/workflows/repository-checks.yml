name: Repository checks

on:
  push:
  pull_request:

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f final/design/toolchain_identity.json
          test -f final/design/source_identity.json
          test -f final/design/run_xsim.ps1
          test -f final/design/run_regression.ps1
          test -f final/design/scripts/run_gate_linux.sh
      - name: Validate identity JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool final/design/toolchain_identity.json >/dev/null
          python -m json.tool final/design/source_identity.json >/dev/null
